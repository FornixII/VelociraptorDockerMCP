services:
  velociraptor-mcp:
    build: .
    image: velociraptor-mcp:latest
    container_name: velociraptor-mcp
    restart: unless-stopped
    environment:
      # Path inside the container where the api_client config is mounted.
      VELOCIRAPTOR_API_CONFIG: /config/api.config.yaml
      # Default org ("" = root org). Override to target a specific org.
      VELOCIRAPTOR_ORG_ID: ""
      # "http" exposes a streamable-HTTP MCP endpoint; use "stdio" for local clients.
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      # Mount your generated api_client config read-only.
      # Generate with: velociraptor --config server.config.yaml config api_client \
      #   --name mcp --role administrator > ./config/api.config.yaml
      - ./config/api.config.yaml:/config/api.config.yaml:ro
